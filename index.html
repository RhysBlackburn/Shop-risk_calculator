<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery Site Risk Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#4B5768;
    --paper:#F7F8FA;
    --card:#FFFFFF;
    --line:#E3E7ED;
    --accent:#2F6F5E;
    --accent-soft:#E7F0EC;
    --low:#2F8F5B;
    --low-bg:#E9F6EF;
    --medium:#C7871F;
    --medium-bg:#FBF1DF;
    --high:#C1443C;
    --high-bg:#FBEAE9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-bottom:80px;
  }
  header{
    background:var(--ink);
    color:#fff;
    padding:28px 20px 24px;
  }
  header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:#B7C0CC;
    font-size:14px;
  }
  main{
    max-width:680px;
    margin:0 auto;
    padding:20px 16px 0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:16px;
  }
  .shop-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .shop-row input{
    flex:1;
    min-width:140px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:'IBM Plex Mono',monospace;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.88;}
  button:active{opacity:.75;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--accent-soft);color:var(--accent);}
  .status-line{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:16px;
  }
  .status-line.err{color:var(--high);}
  .status-line.ok{color:var(--accent);}

  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .section-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--accent);
    letter-spacing:.04em;
  }
  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:600;
    margin:2px 0 2px;
  }
  .section-summary{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .section-badge{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:11px;
    padding:3px 10px;
    border-radius:999px;
    letter-spacing:.03em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .section-badge.low{background:var(--low-bg);color:var(--low);}
  .section-badge.medium{background:var(--medium-bg);color:var(--medium);}
  .section-badge.high{background:var(--high-bg);color:var(--high);}

  .question{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .question:last-child{border-bottom:none;}
  .q-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--accent);
    letter-spacing:.04em;
  }
  .q-text{
    font-size:15px;
    font-weight:500;
    margin:4px 0 10px;
    line-height:1.4;
  }

  .yn-row{
    display:flex;
    gap:8px;
  }
  .yn-row label{
    flex:1;
    position:relative;
  }
  .yn-row input{
    position:absolute;
    opacity:0;
    inset:0;
    cursor:pointer;
  }
  .yn-row span{
    display:block;
    text-align:center;
    padding:9px 0;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper);
  }
  .yn-row input:checked + span{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .lc-block{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .lc-block.show{display:block;}
  .lc-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .lc-scale{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    margin-bottom:14px;
  }
  .lc-scale label{
    position:relative;
  }
  .lc-scale input{
    position:absolute;
    opacity:0;
    inset:0;
    cursor:pointer;
  }
  .lc-scale span{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 2px 5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper);
  }
  .lc-scale span small{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:8px;
    margin-top:2px;
    letter-spacing:.01em;
  }
  .lc-scale input:checked + span{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .lc-score{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .lc-score b{color:var(--ink);}

  .notes-block{
    display:none;
    margin-top:12px;
  }
  .notes-block.show{display:block;}
  .notes-block textarea{
    width:100%;
    min-height:64px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    resize:vertical;
  }

  #results{
    position:sticky;
    bottom:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:16px;
    box-shadow:0 -4px 16px rgba(0,0,0,.05);
  }
  .results-inner{
    max-width:680px;
    margin:0 auto;
  }
  .results-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .total-score{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .rating-badge{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:5px 12px;
    border-radius:999px;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  .rating-badge.low{background:var(--low-bg);color:var(--low);}
  .rating-badge.medium{background:var(--medium-bg);color:var(--medium);}
  .rating-badge.high{background:var(--high-bg);color:var(--high);}

  .save-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .save-row button{flex:1;}

  .config-warning{
    background:var(--high-bg);
    color:var(--high);
    border:1px solid #F1CFCC;
    border-radius:10px;
    padding:14px 16px;
    font-size:13px;
    margin-bottom:16px;
    line-height:1.5;
  }
  .config-warning code{
    background:#fff;
    padding:1px 5px;
    border-radius:4px;
    font-size:12px;
  }
</style>
</head>
<body>

<header>
  <h1>Delivery Site Risk Assessment</h1>
  <p>Answer each question, save by shop number, come back any time.</p>
</header>

<main>
  <div id="configWarning" class="config-warning" style="display:none;">
    Firebase isn't configured yet. Open <code>index.html</code> and fill in the
    <code>firebaseConfig</code> object near the bottom of the file with your own
    project's keys, then reload this page.
  </div>

  <div class="card">
    <div class="section-eyebrow">SHOP</div>
    <div class="shop-row">
      <input id="shopNumber" type="text" placeholder="e.g. 042" autocomplete="off" />
      <button class="btn-ghost" id="loadBtn">Load</button>
    </div>
    <div class="status-line" id="loadStatus"></div>
  </div>

  <div id="sectionsContainer"><!-- sections injected here --></div>
</main>

<div id="results">
  <div class="results-inner">
    <div class="results-top">
      <div class="total-score" id="totalScore">Overall risk</div>
      <div class="rating-badge low" id="ratingBadge">LOW</div>
    </div>
    <div class="save-row">
      <button class="btn-primary" id="saveBtn">Save assessment</button>
    </div>
    <div class="status-line" id="saveStatus"></div>
  </div>
</div>

<script type="module">
  // ---------------------------------------------------------------
  // 1. SECTIONS & QUESTIONS
  //    Edit this list to match what you actually want to assess.
  //    Each question is answered Yes/No. If "Yes", a Likelihood (1-5)
  //    and Consequence (1-5) score appears and is multiplied together
  //    to give that question's risk points (max 25).
  //    Set hasNotes: true to add a free-text box under a question,
  //    shown alongside Likelihood/Consequence when answered "Yes".
  // ---------------------------------------------------------------
  const SECTIONS = [
    {
      id: "parking",
      title: "Parking",
      questions: [
        { id: "loading_area",   text: "Is there a designated loading / unloading area?" },
        { id: "parking_safe",   text: "Is parking safe and legal?" },
        { id: "parking_distance", text: "Is there a significant distance from parking to shop entrance?" },
      ],
    },
    {
      id: "route",
      title: "Access Route",
      questions: [
        { id: "route_obstructed", text: "Is the route clear of obstructions?" },
        { id: "route_uneven",     text: "Are there any slopes, steps, or uneven surfaces?" },
        { id: "route_public",     text: "Is the route through a public area?" },
      ],
    },
    {
      id: "delivery_entrance",
      title: "Delivery Entrance",
      questions: [
        { id: "extra_equipment",  text: "Is additional equipment needed?" },
        { id: "entrance_secure",  text: "Is the delivery entrance secure and accessible?" },
        { id: "time_restrictions", text: "Are there any time restrictions for deliveries?" },
        { id: "street_furniture", text: "Is there street furniture or obstructions?" },
      ],
    },
    {
      id: "other",
      title: "Other Considerations",
      questions: [
        { id: "unsociable_activity", text: "Is the delivery location safe from unsociable activity?" },
        { id: "additional_observations", text: "Are there any other additional observations?", hasNotes: true },
      ],
    },
  ];

  // Section risk % thresholds (section total / section max points)
  const SECTION_MEDIUM_THRESHOLD = 0.2; // over this -> medium
  const SECTION_HIGH_THRESHOLD = 0.4;   // over this -> high

  const LC_MIN = 0;
  const LC_MAX = 5;                      // Likelihood and Consequence are each scored 0-5
  const LC_LABELS = {
    likelihood: { 0: "none", 5: "certain" },
    consequence: { 0: "none", 5: "severe" },
  };

  // ---------------------------------------------------------------
  // 2. FIREBASE CONFIG
  // ---------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBvCAAaAlcfQlwTv1n7htD0YaysUXm1YiQ",
    authDomain: "shop-risk-rating-calculator.firebaseapp.com",
    projectId: "shop-risk-rating-calculator",
    storageBucket: "shop-risk-rating-calculator.firebasestorage.app",
    messagingSenderId: "1045936015695",
    appId: "1:1045936015695:web:1e4d83707a958c3f01dd3a",
  };

  const isConfigured = !Object.values(firebaseConfig).some(v => String(v).startsWith("YOUR_"));
  if (!isConfigured) {
    document.getElementById("configWarning").style.display = "block";
  }

  let db = null;
  let firestoreFns = null;

  async function initFirebase() {
    if (!isConfigured) return;
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    firestoreFns = fs;
  }

  // ---------------------------------------------------------------
  // 3. RENDER SECTIONS
  // ---------------------------------------------------------------
  const sectionsContainer = document.getElementById("sectionsContainer");

  function lcScaleHtml(qid, kind) {
    let html = "";
    for (let v = LC_MIN; v <= LC_MAX; v++) {
      const label = LC_LABELS[kind][v] || "";
      html += `
        <label>
          <input type="radio" name="${qid}_${kind}" value="${v}" ${v === LC_MIN ? "checked" : ""} />
          <span>${v}<small>${label}</small></span>
        </label>`;
    }
    return html;
  }

  SECTIONS.forEach((section, sIdx) => {
    const sectionEl = document.createElement("div");
    sectionEl.className = "card";
    sectionEl.dataset.sectionId = section.id;
    const sNum = String(sIdx + 1).padStart(2, "0");

    let questionsHtml = "";
    section.questions.forEach((q, qIdx) => {
      const qNum = String(qIdx + 1).padStart(2, "0");
      questionsHtml += `
        <div class="question" data-question-id="${q.id}">
          <div class="q-eyebrow">${sNum}.${qNum}</div>
          <div class="q-text">${q.text}</div>
          <div class="yn-row">
            <label>
              <input type="radio" name="${q.id}_yn" value="no" checked />
              <span>No</span>
            </label>
            <label>
              <input type="radio" name="${q.id}_yn" value="yes" />
              <span>Yes</span>
            </label>
          </div>
          ${q.hasNotes ? `
          <div class="notes-block" data-notes-for="${q.id}">
            <textarea name="${q.id}_notes" placeholder="Add details..."></textarea>
          </div>` : ""}
          <div class="lc-block${q.hasNotes ? "" : " show"}" data-lc-for="${q.id}">
            <div class="lc-label">Likelihood</div>
            <div class="lc-scale">${lcScaleHtml(q.id, "likelihood")}</div>
            <div class="lc-label">Consequence</div>
            <div class="lc-scale">${lcScaleHtml(q.id, "consequence")}</div>
            <div class="lc-score">Risk points: <b data-lc-score="${q.id}">0</b> / ${LC_MAX * LC_MAX}</div>
          </div>
        </div>`;
    });

    sectionEl.innerHTML = `
      <div class="section-head">
        <div>
          <div class="section-eyebrow">SECTION ${sNum}</div>
          <div class="section-title">${section.title}</div>
        </div>
        <div class="section-badge low" data-section-badge="${section.id}">LOW</div>
      </div>
      <div class="section-summary" data-section-summary="${section.id}">0 / 0 points (0%)</div>
      ${questionsHtml}
    `;
    sectionsContainer.appendChild(sectionEl);
  });

  // Question ids where Likelihood/Consequence (and any notes box) stay hidden
  // until the question is answered "Yes". All other questions show their
  // Likelihood/Consequence boxes all the time and are always scored.
  const gatedQuestionIds = new Set();
  SECTIONS.forEach(section => {
    section.questions.forEach(q => {
      if (q.hasNotes) gatedQuestionIds.add(q.id);
    });
  });

  // Show/hide the gated Likelihood x Consequence block (and notes box) when Yes/No changes
  sectionsContainer.addEventListener("change", (e) => {
    if (e.target.name && e.target.name.endsWith("_yn")) {
      const qid = e.target.name.replace(/_yn$/, "");
      if (gatedQuestionIds.has(qid)) {
        const lcBlock = sectionsContainer.querySelector(`[data-lc-for="${qid}"]`);
        const notesBlock = sectionsContainer.querySelector(`[data-notes-for="${qid}"]`);
        const isYes = e.target.value === "yes";
        if (lcBlock) lcBlock.classList.toggle("show", isYes);
        if (notesBlock) notesBlock.classList.toggle("show", isYes);
      }
    }
    updateResults();
  });

  // ---------------------------------------------------------------
  // 4. SCORING
  // ---------------------------------------------------------------
  function getAnswers() {
    const sections = {};
    SECTIONS.forEach(section => {
      const answers = {};
      section.questions.forEach(q => {
        const ynInput = sectionsContainer.querySelector(`input[name="${q.id}_yn"]:checked`);
        const yn = ynInput ? ynInput.value : "no";
        const lInput = sectionsContainer.querySelector(`input[name="${q.id}_likelihood"]:checked`);
        const cInput = sectionsContainer.querySelector(`input[name="${q.id}_consequence"]:checked`);
        const likelihood = lInput ? Number(lInput.value) : 0;
        const consequence = cInput ? Number(cInput.value) : 0;
        const answer = { yn, likelihood, consequence };
        if (q.hasNotes) {
          const textarea = sectionsContainer.querySelector(`textarea[name="${q.id}_notes"]`);
          answer.notes = textarea ? textarea.value : "";
        }
        answers[q.id] = answer;
      });
      sections[section.id] = answers;
    });
    return sections;
  }

  function setAnswers(sections) {
    SECTIONS.forEach(section => {
      const sectionAnswers = (sections && sections[section.id]) || {};
      section.questions.forEach(q => {
        const a = sectionAnswers[q.id] || { yn: "no", likelihood: 0, consequence: 0, notes: "" };
        const ynInput = sectionsContainer.querySelector(`input[name="${q.id}_yn"][value="${a.yn}"]`);
        if (ynInput) ynInput.checked = true;

        if (gatedQuestionIds.has(q.id)) {
          const lcBlock = sectionsContainer.querySelector(`[data-lc-for="${q.id}"]`);
          const notesBlock = sectionsContainer.querySelector(`[data-notes-for="${q.id}"]`);
          const isYes = a.yn === "yes";
          if (lcBlock) lcBlock.classList.toggle("show", isYes);
          if (notesBlock) notesBlock.classList.toggle("show", isYes);
        }

        const lVal = a.likelihood != null ? a.likelihood : 0;
        const cVal = a.consequence != null ? a.consequence : 0;
        const lInput = sectionsContainer.querySelector(`input[name="${q.id}_likelihood"][value="${lVal}"]`);
        const cInput = sectionsContainer.querySelector(`input[name="${q.id}_consequence"][value="${cVal}"]`);
        if (lInput) lInput.checked = true;
        if (cInput) cInput.checked = true;

        if (q.hasNotes) {
          const textarea = sectionsContainer.querySelector(`textarea[name="${q.id}_notes"]`);
          if (textarea) textarea.value = a.notes || "";
        }
      });
    });
    updateResults();
  }

  function ratingFromPercentage(percentage) {
    if (percentage > SECTION_HIGH_THRESHOLD) return "high";
    if (percentage > SECTION_MEDIUM_THRESHOLD) return "medium";
    return "low";
  }

  function updateResults() {
    const sections = getAnswers();
    let overallRating = "low";
    const sectionResults = {};

    SECTIONS.forEach(section => {
      const answers = sections[section.id];
      let total = 0;
      section.questions.forEach(q => {
        const a = answers[q.id];
        const counts = q.hasNotes ? a.yn === "yes" : true;
        const points = counts ? (a.likelihood || 0) * (a.consequence || 0) : 0;
        total += points;

        // update the little "risk points" readout next to each question
        const scoreEl = sectionsContainer.querySelector(`[data-lc-score="${q.id}"]`);
        if (scoreEl) scoreEl.textContent = points;
      });
      const max = section.questions.length * LC_MAX * LC_MAX;
      const percentage = max > 0 ? total / max : 0;
      const rating = ratingFromPercentage(percentage);

      sectionResults[section.id] = { total, max, percentage, rating };

      if (rating === "high") overallRating = "high";
      if (rating === "medium" && overallRating !== "high") overallRating = "medium";

      const badgeEl = sectionsContainer.querySelector(`[data-section-badge="${section.id}"]`);
      if (badgeEl) {
        badgeEl.textContent = rating;
        badgeEl.className = `section-badge ${rating}`;
      }
      const summaryEl = sectionsContainer.querySelector(`[data-section-summary="${section.id}"]`);
      if (summaryEl) {
        summaryEl.textContent = `${total} / ${max} points (${Math.round(percentage * 100)}%)`;
      }
    });

    const ratingBadge = document.getElementById("ratingBadge");
    ratingBadge.textContent = overallRating;
    ratingBadge.className = `rating-badge ${overallRating}`;

    return { sections, sectionResults, overallRating };
  }

  // ---------------------------------------------------------------
  // 5. SAVE / LOAD
  // ---------------------------------------------------------------
  const shopInput = document.getElementById("shopNumber");
  const loadStatus = document.getElementById("loadStatus");
  const saveStatus = document.getElementById("saveStatus");

  function setStatus(el, msg, type) {
    el.textContent = msg;
    el.className = `status-line ${type || ""}`;
  }

  async function loadAssessment() {
    const shopNumber = shopInput.value.trim();
    if (!shopNumber) {
      setStatus(loadStatus, "Enter a shop number first.", "err");
      return;
    }
    if (!isConfigured) {
      setStatus(loadStatus, "Firebase isn't configured yet — see the notice above.", "err");
      return;
    }
    setStatus(loadStatus, "Loading…");
    try {
      const { doc, getDoc } = firestoreFns;
      const ref = doc(db, "shopRiskAssessments", shopNumber);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const data = snap.data();
        setAnswers(data.sections);
        const when = data.updatedAt && data.updatedAt.toDate
          ? data.updatedAt.toDate().toLocaleString()
          : "an earlier date";
        setStatus(loadStatus, `Loaded previous assessment (saved ${when}).`, "ok");
      } else {
        setAnswers({});
        setStatus(loadStatus, `No saved assessment for shop ${shopNumber} yet — starting fresh.`, "ok");
      }
    } catch (err) {
      console.error(err);
      setStatus(loadStatus, "Couldn't load — check your Firebase config and internet connection.", "err");
    }
  }

  async function saveAssessment() {
    const shopNumber = shopInput.value.trim();
    if (!shopNumber) {
      setStatus(saveStatus, "Enter a shop number first.", "err");
      return;
    }
    if (!isConfigured) {
      setStatus(saveStatus, "Firebase isn't configured yet — see the notice above.", "err");
      return;
    }
    const { sections, sectionResults, overallRating } = updateResults();
    setStatus(saveStatus, "Saving…");
    try {
      const { doc, setDoc, serverTimestamp } = firestoreFns;
      const ref = doc(db, "shopRiskAssessments", shopNumber);
      await setDoc(ref, {
        shopNumber,
        sections,
        sectionResults,
        overallRating,
        updatedAt: serverTimestamp(),
      });
      setStatus(saveStatus, `Saved for shop ${shopNumber}.`, "ok");
    } catch (err) {
      console.error(err);
      setStatus(saveStatus, "Couldn't save — check your Firebase config and internet connection.", "err");
    }
  }

  document.getElementById("loadBtn").addEventListener("click", loadAssessment);
  document.getElementById("saveBtn").addEventListener("click", saveAssessment);

  initFirebase();
  updateResults();
</script>

</body>
